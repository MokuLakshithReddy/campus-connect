name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality (Lint)
        run: npm run lint

      - name: TypeScript Verification
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Run Test Suite
        run: npm test

      - name: PostgreSQL Integration Tests (Clean DB & Security Verification)
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/postgres"
        run: npm run test:db

      - name: Build Web Application (Staging Integration)
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID || 'staging-campusconnect' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_staging_demo_key_restricted' }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://staging-campusconnect.supabase.co' }}
        run: npm run build
