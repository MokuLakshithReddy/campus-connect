name: Build Android Debug APK (Preview)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_PROJECT_ID: "gtkvujspajcelzufpggr"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_fr0wwYVpS66JH1qHwbUxbA_QJ8uNjMk"
          VITE_SUPABASE_URL: "https://gtkvujspajcelzufpggr.supabase.co"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Debug APK artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk campus-connect-preview-debug.apk

      - name: Upload Debug APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-connect-preview-debug-apk
          path: campus-connect-preview-debug.apk

