name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_SUPABASE_PROJECT_ID: "gtkvujspajcelzufpggr"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_fr0wwYVpS66JH1qHwbUxbA_QJ8uNjMk"
          VITE_SUPABASE_URL: "https://gtkvujspajcelzufpggr.supabase.co"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk campus-connect-v1.2.6.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk campus-connect.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk social-feed-connect.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-connect-v1.2.6-apk
          path: campus-connect-v1.2.6.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.6' }}
          name: CampusConnect ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.6' }}
          files: |
            campus-connect-v1.2.6.apk
            campus-connect.apk
            social-feed-connect.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
