name: Release Android Production (Signed APK & AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to release (e.g. v1.2.6)'
        required: false
        default: ''
      verify_only:
        description: 'Verify build compilation only without publishing (allowed for test builds)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Build & Publish Production Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK Build Tools
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Determine Release Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
          else
            RAW_TAG="v$(node -p "require('./package.json').version")"
          fi
          VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building CampusConnect Android Release Version: ${VER} (Tag: ${RAW_TAG})"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_PROJECT_ID: "gtkvujspajcelzufpggr"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_fr0wwYVpS66JH1qHwbUxbA_QJ8uNjMk"
          VITE_SUPABASE_URL: "https://gtkvujspajcelzufpggr.supabase.co"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android Signing Credentials
        id: signing_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_VERIFY_ONLY: ${{ github.event.inputs.verify_only }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "${KEYSTORE_DIR}"
          KEYSTORE_FILE="${KEYSTORE_DIR}/release.keystore"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using production signing credentials from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "is_production_signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_VERIFY_ONLY" = "true" ]; then
            echo "::warning::VERIFY-ONLY RUN: Real signing credentials omitted. Generating temporary key solely to verify Gradle bundle and assemble tasks. This artifact will NOT be published."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias "campusconnect-verify" \
              -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "verifykeypass123" -keypass "verifykeypass123" \
              -dname "CN=CampusConnect Verification, OU=CI, O=CampusConnect, L=Campus, S=State, C=IN"
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=verifykeypass123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=campusconnect-verify" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=verifykeypass123" >> "$GITHUB_ENV"
            echo "is_production_signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CRITICAL: Production release signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS) are missing."
            echo "::error::To publish a production release, configure these secrets in GitHub Repository Settings -> Secrets and Variables -> Actions."
            echo "::error::Temporary key publishing is forbidden to prevent app update signature mismatches."
            exit 1
          fi

      - name: Build Release APK and Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Package Release Artifacts
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          SRC_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          SRC_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "$SRC_APK" ] || [ -z "$SRC_AAB" ]; then
            echo "::error::Release build artifacts not found."
            exit 1
          fi

          mkdir -p release-artifacts
          TARGET_APK="release-artifacts/campus-connect-${TAG}.apk"
          TARGET_AAB="release-artifacts/campus-connect-${TAG}.aab"
          TARGET_CHECKSUM="release-artifacts/campus-connect-${TAG}-checksums.txt"

          cp "$SRC_APK" "$TARGET_APK"
          cp "$SRC_AAB" "$TARGET_AAB"

          cd release-artifacts
          sha256sum "campus-connect-${TAG}.apk" > "campus-connect-${TAG}-checksums.txt"
          sha256sum "campus-connect-${TAG}.aab" >> "campus-connect-${TAG}-checksums.txt"
          cd ..

          echo "apk_path=${TARGET_APK}" >> "$GITHUB_OUTPUT"
          echo "aab_path=${TARGET_AAB}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${TARGET_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "Generated release artifacts:"
          cat "$TARGET_CHECKSUM"

      - name: Verify Cryptographic Signatures (apksigner & jarsigner)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK_FILE="release-artifacts/campus-connect-${TAG}.apk"
          AAB_FILE="release-artifacts/campus-connect-${TAG}.aab"

          echo "=== Verifying APK Signature ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_FILE"

          echo "=== Verifying AAB Signature ==="
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -E "jar verified|Signed by|Certificate owner" || true

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: campus-connect-${{ steps.version.outputs.tag }}-release-artifacts
          path: release-artifacts/*

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version_tag != '') && steps.signing_setup.outputs.is_production_signed == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CampusConnect Production Release ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
